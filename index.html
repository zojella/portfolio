<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zofia Dzwonnik - Portfolio</title>
<style>
html, body { padding: 0; margin: 0; width: 100%; height: 100%; background: #1e1e1e; }

/* The scroll container: one slide per screen, snapping to each */
#slides {
  height: 100vh;
  height: 100dvh;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  scroll-behavior: smooth;
}
.slide {
  height: 100vh;
  height: 100dvh;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slide img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  transition: transform 0.25s ease;
}

/* Zoom: click to magnify 300% at the cursor, click again to return */
.slide { position: relative; overflow: hidden; cursor: zoom-in; }
.slide.zoomed { cursor: zoom-out; touch-action: none; }
.slide.zoomed img { transform: scale(4.5); }
#slides.locked { overflow: hidden; }

/* Spacer slides: no zoom, image centered with breathing room on all sides */
.slide:has(img.spacer) { cursor: default; }
.slide img.spacer {
  --spacer-margin: 10vmin;
  margin: var(--spacer-margin);
  max-width: calc(100% - 2 * var(--spacer-margin));
  max-height: calc(100% - 2 * var(--spacer-margin));
}

/* Loading spinner, shown on each slide until its image has arrived */
.slide::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 40px;
  height: 40px;
  margin: -20px 0 0 -20px;
  border: 3px solid rgba(255, 255, 255, 0.15);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.slide.loaded::before { display: none; }
.slide img { opacity: 0; }
.slide.loaded img { opacity: 1; transition: opacity 0.3s ease, transform 0.25s ease; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Full-screen loader, shown until every image has downloaded */
#loader {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: #1e1e1e;
  color: #fff;
  font: 14px/1 system-ui, sans-serif;
  transition: opacity 0.5s ease;
}
#loader.done { opacity: 0; pointer-events: none; }
#loader .ring {
  width: 40px;
  height: 40px;
  border: 3px solid rgba(255, 255, 255, 0.15);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
#loader .bar { width: 200px; height: 3px; background: rgba(255, 255, 255, 0.15); border-radius: 2px; overflow: hidden; }
#loader .fill { width: 0; height: 100%; background: #fff; transition: width 0.3s ease; }

/* Navigation */
.nav {
  position: fixed;
  right: 20px;
  bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font: 14px/1 system-ui, sans-serif;
  color: #fff;
  background: rgba(0, 0, 0, 0.5);
  padding: 6px;
  border-radius: 24px;
}
.nav button {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}
.nav button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.3); }
.nav button:disabled { opacity: 0.3; cursor: default; }
#counter { min-width: 48px; text-align: center; }
</style>
</head>
<body>
<div id="slides">
  <div class="slide"><img class="spacer" src="Artboard 41@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 42@4x.png"></div>
  <div class="slide"><img src="Artboard 1@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 43@4x.png"></div>
  <div class="slide"><img src="Artboard 2@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 44@4x.png"></div>
  <div class="slide"><img src="Artboard 3@4x.png"></div>
  <div class="slide"><img src="Artboard 4@4x.png"></div>
  <div class="slide"><img src="Artboard 38@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 45@4x.png"></div>
  <div class="slide"><img src="Artboard 5@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 46@4x.png"></div>
  <div class="slide"><img src="Artboard 6@4x.png"></div>
  <div class="slide"><img src="Artboard 27@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 47@4x.png"></div>
  <div class="slide"><img src="Artboard 10@4x.png"></div>
  <div class="slide"><img src="Artboard 11@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 48@4x.png"></div>
  <div class="slide"><img src="Artboard 12@4x.png"></div>
  <div class="slide"><img src="Artboard 13@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 49@4x.png"></div>
  <div class="slide"><img src="Artboard 7@4x.png"></div>
  <div class="slide"><img src="Artboard 8@4x.png"></div>
  <div class="slide"><img src="Artboard 9@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 50@4x.png"></div>
  <div class="slide"><img src="Artboard 29@4x.png"></div>
  <div class="slide"><img src="Artboard 30@4x.png"></div>
  <div class="slide"><img src="Artboard 31@4x.png"></div>
  <div class="slide"><img class="spacer" src="Artboard 51@4x.png"></div>
  <div class="slide"><img src="Artboard 32@4x.png"></div>
  <div class="slide"><img src="Artboard 33@4x.png"></div>
  <div class="slide"><img src="Artboard 34@4x.png"></div>
</div>

<div id="loader">
  <div class="ring"></div>
  <div class="bar"><div class="fill"></div></div>
  <div id="progress"></div>
</div>

<div class="nav">
  <button id="prev" aria-label="Previous slide">&#8593;</button>
  <span id="counter"></span>
  <button id="next" aria-label="Next slide">&#8595;</button>
</div>

<script>
const container = document.getElementById('slides');
const slides = container.querySelectorAll('.slide');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const counter = document.getElementById('counter');

// --- Loading ---
// Hide each slide's spinner once its image has finished loading,
// and keep the full-screen loader up until all of them have
const loader = document.getElementById('loader');
const fill = loader.querySelector('.fill');
const progress = document.getElementById('progress');
let loadedCount = 0;

function showProgress() {
  progress.textContent = loadedCount + ' / ' + slides.length;
  fill.style.width = (loadedCount / slides.length * 100) + '%';
  if (loadedCount === slides.length) loader.classList.add('done');
}

slides.forEach(slide => {
  const img = slide.querySelector('img');
  const done = () => { slide.classList.add('loaded'); loadedCount++; showProgress(); };
  if (img.complete) done();
  else { img.addEventListener('load', done); img.addEventListener('error', done); }
});
showProgress();

function current() {
  return Math.round(container.scrollTop / container.clientHeight);
}

// --- Zoom ---
let zoomed = null;

// Point the zoom at the cursor, as a percentage of the image
function aim(slide, e) {
  const img = slide.querySelector('img');
  // offset* values ignore the scale transform, so this is the image's unzoomed box
  const s = slide.getBoundingClientRect();
  const x = Math.max(0, Math.min(100, (e.clientX - s.left - img.offsetLeft) / img.offsetWidth * 100));
  const y = Math.max(0, Math.min(100, (e.clientY - s.top - img.offsetTop) / img.offsetHeight * 100));
  img.style.transformOrigin = x + '% ' + y + '%';
}

function unzoom() {
  if (!zoomed) return;
  zoomed.classList.remove('zoomed');
  container.classList.remove('locked');
  zoomed = null;
}

slides.forEach(slide => {
  if (slide.querySelector('img.spacer')) return;
  slide.addEventListener('click', e => {
    if (zoomed) { unzoom(); return; }
    aim(slide, e);
    slide.classList.add('zoomed');
    container.classList.add('locked');
    zoomed = slide;
  });
  // While zoomed, moving the pointer pans around the image
  slide.addEventListener('pointermove', e => { if (slide === zoomed) aim(slide, e); });
});

function goTo(i) {
  unzoom();
  i = Math.max(0, Math.min(slides.length - 1, i));
  slides[i].scrollIntoView({ behavior: 'smooth' });
}

function update() {
  const i = current();
  counter.textContent = (i + 1) + ' / ' + slides.length;
  prev.disabled = i === 0;
  next.disabled = i === slides.length - 1;
}

prev.addEventListener('click', () => goTo(current() - 1));
next.addEventListener('click', () => goTo(current() + 1));

document.addEventListener('keydown', e => {
  if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); goTo(current() + 1); }
  else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); goTo(current() - 1); }
  else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
  else if (e.key === 'End') { e.preventDefault(); goTo(slides.length - 1); }
  else if (e.key === 'Escape') unzoom();
});

container.addEventListener('scroll', update);
window.addEventListener('resize', update);
update();
</script>
</body>
</html>
